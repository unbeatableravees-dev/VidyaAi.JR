<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Rounded container background -->
  <rect width="100" height="100" rx="26" fill="#2563eb" />
  
  <!-- Star character -->
  <g transform="translate(15, 18) scale(0.7)">
    <!-- Yellow star body -->
    <path d="M 50 5 L 63 35 L 95 38 L 71 60 L 78 92 L 50 75 L 22 92 L 29 60 L 5 38 L 37 35 Z" 
          fill="#FACC15" stroke="#EAB308" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Cheerful face -->
    <!-- Eyes -->
    <ellipse cx="40" cy="48" rx="4" ry="6" fill="#1E293B" />
    <ellipse cx="60" cy="48" rx="4" ry="6" fill="#1E293B" />
    <circle cx="41.5" cy="46" r="1.5" fill="#FFFFFF" />
    <circle cx="61.5" cy="46" r="1.5" fill="#FFFFFF" />
    <!-- Cheeks -->
    <ellipse cx="33" cy="55" rx="4.5" ry="3" fill="#F87171" opacity="0.6" />
    <ellipse cx="67" cy="55" rx="4.5" ry="3" fill="#F87171" opacity="0.6" />
    <!-- Smile -->
    <path d="M 43 55 Q 50 63 57 55" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round" />
    
    <!-- Graduation Cap on top -->
    <g transform="translate(18, -8) rotate(-8 32 30)">
      <!-- Cap top diamond -->
      <polygon points="32,15 58,25 32,35 6,25" fill="#1E3A8A" />
      <polygon points="32,15 58,25 32,27 6,25" fill="#3B82F6" opacity="0.5" />
      <!-- Skull cap underneath -->
      <path d="M 18 28 Q 32 35 46 28 L 46 34 Q 32 40 18 34 Z" fill="#172554" />
      <!-- Tassel -->
      <path d="M 32 25 Q 48 30 50 42" fill="none" stroke="#F59E0B" stroke-width="2.5" />
      <circle cx="50" cy="44" r="3" fill="#D97706" />
      <circle cx="32" cy="25" r="2.5" fill="#FCD34D" />
    </g>
  </g>
</svg>
